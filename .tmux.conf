# Enable mouse support
set -g mouse on

# Enable vi mode for copy/scroll
setw -g mode-keys vi

# Use vim-like prefix (Ctrl+a instead of Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Better pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys (Alt+hjkl)
bind -M normal {
    bind-key -T normal h resize-pane -L 5
    bind-key -T normal j resize-pane -D 5
    bind-key -T normal k resize-pane -U 5
    bind-key -T normal l resize-pane -R 5
}

# Create new window/split with vim-like shortcuts
bind c new-window
bind % split-window -h
bind '"' split-window -v

# Kill pane/window
bind x kill-pane
bind & kill-window

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Set base index to 1 (optional, for vim-like numbering)
set -g base-index 1
setw -g pane-base-index 1
